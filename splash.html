<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Neerada Grading System</title><link id="splash-favicon" rel="icon" href=""><link id="splash-apple" rel="apple-touch-icon" href=""><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#d90000;color:#fff}body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}.splash{width:min(560px,90vw);padding:24px;text-align:center;position:relative;z-index:1}.mark{width:132px;height:132px;border-radius:50%;background:#ffc72c;color:#292929;display:grid;place-items:center;font-size:58px;font-weight:900;margin:0 auto 28px;box-shadow:0 0 28px rgba(255,255,255,.68),0 0 62px rgba(255,199,44,.75),0 20px 50px rgba(0,0,0,.2);overflow:hidden}.splash:before,.splash:after{content:"";position:fixed;border-radius:50%;background:#ffc72c;opacity:.95}.splash:before{width:340px;height:340px;left:-180px;top:-160px}.splash:after{width:420px;height:420px;right:-240px;bottom:-230px}h1{margin:0;font-size:clamp(30px,6vw,48px);font-weight:900;letter-spacing:-.02em}.splash p{margin:10px 0 0;color:rgba(255,255,255,.85)}.bar{width:220px;height:6px;background:rgba(255,255,255,.2);border-radius:999px;margin:28px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:999px;animation:load 1.7s ease forwards}@keyframes load{to{width:100%}}@media(max-width:600px){.splash{width:100%;padding:20px}.mark{width:112px;height:112px;font-size:48px;margin-bottom:22px}h1{font-size:clamp(28px,9vw,42px);line-height:1.08}.splash p{font-size:14px}.bar{width:min(220px,72vw)}}
</style></head><body><div class="splash"><div class="mark"><img id="splash-logo" alt="" style="display:none;width:100%;height:100%;object-fit:contain;border-radius:50%"><span id="splash-mark">G</span></div><h1>Neerada Grading System</h1><p>Loading school portal…</p><div class="bar"><i></i></div></div><script>async function loadCloudBranding(){try{const configs=await Promise.all([fetch('lower-config.json').then(r=>r.json()),fetch('higher-config.json').then(r=>r.json())]);for(const [i,c] of configs.entries()){const level=i===0?'lower':'higher',name='splash-brand-'+level;const app=firebase.apps.some(a=>a.name===name)?firebase.app(name):firebase.initializeApp(c.firebase,name);const snap=await app.firestore().collection('systemSettings').doc('branding').get();if(snap.exists){const b=snap.data()||{};if(b.name)document.querySelector('h1').textContent=b.name;if(b.logo){const img=document.getElementById('splash-logo');img.src=b.logo;img.style.display='block';document.getElementById('splash-mark').style.display='none'}document.getElementById('splash-favicon').href=b.favicon||b.logo||'';document.getElementById('splash-apple').href=b.appleTouchIcon||b.logo||'';break}}}catch(e){console.warn('Branding load deferred:',e)}}loadCloudBranding();setTimeout(function(){location.replace('login.html'+location.search)},1800);</script></body></html>
